<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="eyebrow">polyglot template</p>
    <h1>打个招呼</h1>
    <p class="lead">和仓库里其他语言一样：空白名字会回到 world。</p>
    <form id="greet-form">
      <label for="name">名字</label>
      <div class="row">
        <input id="name" name="name" autocomplete="name" placeholder="Ada">
        <button type="submit">打招呼</button>
      </div>
    </form>
    <p id="output" aria-live="polite"></p>
  </main>
  <script type="module" src="starter.js"></script>
</body>
</html>
